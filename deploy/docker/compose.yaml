# Single-node privacyIDEA stack: one MariaDB plus the three roles of the
# privacyIDEA image (init, web, cron), all run from the same image and
# selected by environment variables in entrypoint.sh:
#   pi-init  PI_INIT_ONLY=true  — create tables, run migrations, bootstrap admin,
#                                 install the enckey canary, then exit
#   pi       (default)          — gunicorn web workers
#   pi-cron  PI_CRON_MODE=true  — maintenance scheduler (table cleanups, audit
#                                 rotate, UI-configured periodic tasks)
#
# Your own changes to this file belong in compose.override.yaml, which an update
# of these files leaves alone. compose.external-db.yaml replaces the bundled
# MariaDB with a database of yours. See README.Docker.md for both.

name: privacyIDEA

# Log rotation, used by every service. Docker's default json-file driver keeps the
# whole output of a container, which fills /var/lib/docker over the months. Here
# each container keeps at most 5 files of 10 MB; "docker compose logs" reads them.
# This replaces a log driver set for the host in /etc/docker/daemon.json; to keep
# that one, see "Logs" in README.Docker.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared image + wiring for the three privacyIDEA roles. The three services below
# reuse this block via YAML anchors: "&pi-common" / "&pi-common-env" name these
# mappings, and "<<: *pi-common" in a service merges their keys in. Each service
# then only lists the env vars that make it an init/web/cron container; keys it
# repeats override the shared value.
#
# "x-" prefixes an extension field, which Compose ignores as a service — it just
# holds the anchors.
x-pi-common: &pi-common
  # The release this file belongs to; the version is raised here, and in
  # PI_COMPOSE_VERSION below, before a new release is tagged. Set PI_IMAGE in .env
  # to run another version, or an image built from this source tree with
  # compose.build.yaml. Never "latest": pi-init migrates the database to whatever
  # image it runs.
  image: ${PI_IMAGE:-harbor.netknights.it/privacyidea/privacyidea:3.14}
  logging: *logging
  # The privacyIDEA processes run as an unprivileged user and need no Linux
  # capabilities, so none are kept.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  secrets:
    - enckey
    - secret_key
    - pi_pepper
    - mariadb_password
    # Audit signing keypair — without it privacyIDEA silently disables audit and
    # response signing. DockerConfig auto-detects /run/secrets/audit_key_*.
    - audit_key_private
    - audit_key_public
  env_file:
    # PRIVACYIDEA_-prefixed config keys, applied to all roles. Created by
    # "make init" from privacyidea.env.template.
    - ./privacyidea.env
  environment: &pi-common-env
    # The release of this file, the same as in the image above. The containers
    # warn when they run a different privacyIDEA version.
    PI_COMPOSE_VERSION: "3.14"
    # These are DockerConfig's inputs: the DB connection parts (it builds the URI)
    # and the file-based secrets. All other privacyIDEA config is set as
    # PRIVACYIDEA_<key> in privacyidea.env — kept out of here so this block stays
    # a single, consistent group. PI_DB_* names also let pi-manage work when
    # exec'd into the container manually.
    PI_DB_USER: pi
    PI_DB_HOST: db
    PI_DB_NAME: pi
    PI_DB_PASSWORD_FILE: /run/secrets/mariadb_password
    # enckey, pepper and secret_key are read from these files by DockerConfig.
    PI_ENCFILE: /run/secrets/enckey
    PI_PEPPER_FILE: /run/secrets/pi_pepper
    PI_SECRET_KEY_FILE: /run/secrets/secret_key

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    logging: *logging
    # Not cap_drop: the image's entrypoint starts as root to prepare the data
    # directory, then switches to the mysql user.
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_USER: pi
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_DATABASE: pi
      # Runs mariadb-upgrade when the data directory was written by an older
      # MariaDB version, so a version bump of the image above needs no manual step.
      MARIADB_AUTO_UPGRADE: "1"
    secrets:
      - mariadb_password
      # Root password is needed by scripts/backup.sh and scripts/restore.sh.
      - mariadb_root_password
    volumes:
      - db-data:/var/lib/mysql
      # Server options of yours, created by "make init" from mariadb.cnf.template.
      # Long syntax, so that a missing file stops "up" instead of Docker creating
      # a directory in its place.
      - type: bind
        source: ./mariadb.cnf
        target: /etc/mysql/conf.d/privacyidea.cnf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 5
      start_period: 30s

  # One-shot: create tables, run migrations, bootstrap the admin, install the
  # enckey canary, then exit. pi and pi-cron wait for it to complete.
  pi-init:
    <<: *pi-common
    # Overrides (not extends) the anchor's secrets, so re-list them here.
    secrets:
      - enckey
      - secret_key
      - pi_pepper
      - mariadb_password
      - bootstrap_admin_password
      - audit_key_private
      - audit_key_public
    environment:
      <<: *pi-common-env
      PI_INIT_ONLY: "true"
      PI_CREATE_TABLES: "true"
      PI_RUN_MIGRATIONS: "true"
      PI_BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-admin}
    # Exits after its one-shot work — disable the image HEALTHCHECK (which
    # expects gunicorn on :8080) so it does not spuriously report unhealthy.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  # Web workers (gunicorn).
  pi:
    <<: *pi-common
    restart: unless-stopped
    ports:
      # Bound to localhost only — this is plain HTTP and must not be exposed on
      # the network. For remote access, terminate TLS (the "tls" Caddy profile,
      # which reaches pi over the internal network) or your own reverse proxy.
      # Change to "8080:8080" only if you accept unencrypted access (in
      # compose.override.yaml, as "ports: !override", see the README).
      - "127.0.0.1:8080:8080"
    networks:
      default:
      # The network Caddy reaches pi on, see "networks:" at the end.
      proxy:
    environment:
      <<: *pi-common-env
      PI_CREATE_TABLES: "false"
      PI_RUN_MIGRATIONS: "false"
      PI_WORKERS: ${PI_WORKERS:-4}
    depends_on:
      pi-init:
        # Workers start only after the init job has finished — no migration race.
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Maintenance scheduler. Runs the tasks defined in cron-runner.py's TASKS list
  # (periodic tasks, table cleanups, audit rotation); toggle/tune them with the
  # PI_CRON_* variables below. Keep this at a single instance — two would race on
  # deleting the same rows. Periodic tasks configured in the UI should target node
  # name "pi-cron" to be picked up here.
  pi-cron:
    <<: *pi-common
    restart: unless-stopped
    # On a stop (make down, make upgrade) a running maintenance task may finish,
    # but only for this long; a task still running then is killed.
    stop_grace_period: 2m
    environment:
      <<: *pi-common-env
      PI_CRON_MODE: "true"
      # Fixed node name so UI-configured periodic tasks (EventCounter, SimpleStats,
      # ...) can target this container. Those are configured in the
      # web UI, not here — cron-runner.py's "periodic tasks" entry executes them.
      PRIVACYIDEA_PI_NODE: pi-cron
      # Audit rotation — defaults shown.
      # Schedule: by default daily at PI_CRON_AUDIT_HOUR. Set PI_CRON_AUDIT_INTERVAL
      # (e.g. "6h", "90m", "2d") to run on a fixed interval instead; it takes
      # precedence over PI_CRON_AUDIT_HOUR.
      # Amount: watermark-based by default; set PI_CRON_AUDIT_AGE (days) for
      # age-based rotation instead, e.g. PI_CRON_AUDIT_AGE: 90.
      #PI_CRON_AUDIT_ROTATE: "true"
      #PI_CRON_AUDIT_HOUR: "2"
      #PI_CRON_AUDIT_INTERVAL: "6h"
      #PI_CRON_AUDIT_AGE: 90
      #PI_CRON_AUDIT_HIGHWATERMARK: "50000"
      #PI_CRON_AUDIT_LOWWATERMARK: "25000"
      #PI_CRON_AUDIT_CHUNKSIZE: ""
      #PI_CRON_CHALLENGE_CLEANUP: "true"
      #PI_CRON_PERIODIC_TASKS: "true"
      # Usercache cleanup — a no-op unless the user cache is enabled. Same
      # schedule model as audit: PI_CRON_USERCACHE_HOUR or _INTERVAL.
      #PI_CRON_USERCACHE_CLEANUP: "true"
      #PI_CRON_USERCACHE_HOUR: "4"
      #PI_CRON_USERCACHE_INTERVAL: "12h"
      # Daily at 03:00 UTC: expired remembered devices, authentication cache
      # entries no auth_cache policy accepts any more, metric rows older than
      # 24 hours, expired IP blocks and user locks.
      #PI_CRON_REMEMBERED_DEVICE_CLEANUP: "true"
      #PI_CRON_AUTHCACHE_CLEANUP: "true"
      #PI_CRON_METRICS_CLEANUP: "true"
      #PI_CRON_CONDITIONAL_ACCESS_PURGE: "true"
      # Authentication log retention in days, off by default and with 0 (the
      # log is kept forever). Runs daily at 03:00 UTC once set.
      #PI_CRON_AUTHLOG_AGE: 90
    healthcheck:
      disable: true
    depends_on:
      pi-init:
        condition: service_completed_successfully

  # Optional TLS-terminating reverse proxy. Not started by default; enable it with
  # COMPOSE_PROFILES=tls in .env, so that every command (make up, make down, the
  # scripts) includes it.
  # Set PI_SITE_ADDRESS in caddy.env to the public hostname — Caddy then obtains
  # and renews a Let's Encrypt certificate automatically (needs public DNS + ports
  # 80/443 reachable). For an internal host without public DNS, set
  # PI_CADDY_TLS="tls internal" there. When fronting with Caddy you can drop the
  # pi "ports:" mapping above (in compose.override.yaml) so the app is only
  # reachable through TLS.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    logging: *logging
    # Caddy runs as root in its image; binding ports 80 and 443 is the only
    # privilege it needs.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    networks:
      proxy:
        ipv4_address: ${PI_PROXY_ADDRESS:-192.168.255.242}
    env_file:
      # PI_SITE_ADDRESS and PI_CADDY_TLS for the Caddyfile. Created by
      # "make init" from caddy.env.template.
      - ./caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      pi:
        condition: service_healthy

# Secrets are read from files in ./secrets/. Run "make init" (or the commands in
# secrets/README.md) to generate them before the first "docker compose up".
secrets:
  enckey:
    file: ./secrets/enckey
  secret_key:
    file: ./secrets/secret_key
  pi_pepper:
    file: ./secrets/pi_pepper
  mariadb_password:
    file: ./secrets/mariadb_password
  mariadb_root_password:
    file: ./secrets/mariadb_root_password
  bootstrap_admin_password:
    file: ./secrets/bootstrap_admin_password
  audit_key_private:
    file: ./secrets/audit_key_private
  audit_key_public:
    file: ./secrets/audit_key_public

networks:
  # Caddy and pi only. privacyIDEA sees every request through Caddy as coming
  # from Caddy's fixed address PI_PROXY_ADDRESS, so that is the one address to
  # name in the system setting "Override Authorization Clients" (see the README,
  # section TLS). Docker gives pi, and the one-off containers of "make pimanage",
  # addresses from PI_PROXY_IP_RANGE, which must not contain PI_PROXY_ADDRESS.
  # Change all three in .env if the subnet collides with a network of yours.
  proxy:
    ipam:
      config:
        - subnet: ${PI_PROXY_SUBNET:-192.168.255.240/28}
          ip_range: ${PI_PROXY_IP_RANGE:-192.168.255.248/29}

volumes:
  db-data:
  caddy-data:
  caddy-config:
