name: "CodeQL"

on:
  pull_request:
    branches:
      - "master"
      - 'branch-*'
  schedule:
    - cron: '31 23 * * *'

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # for github/codeql-action to upload SARIF results

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      # The CodeQL Repo is weird, it is unclear how to tag the actions with a commit
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml
        # privacyIDEA custom security queries, Python only. The "+" runs them in addition to
        # the default suite. See .github/codeql/queries/README.md.
        queries: ${{ matrix.language == 'python' && '+./.github/codeql/queries' || '' }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
      with:
        category: "/language:${{matrix.language}}"
