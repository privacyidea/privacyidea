#
# Extracts the new WebUI's i18n strings once a day and merges them into the
# source file and every target locale (see the `extract-i18n` target in
# privacyidea/static_new/angular.json). Weblate translates the target files but
# never adds new units to them, so without this job newly marked-up strings
# never reach the translators.
#
# The result is kept in ONE long-lived pull request: the bot branch is rebuilt
# from the default branch and force-pushed every run, so yesterday's PR is
# updated in place instead of a second one piling up. When there is nothing left
# to extract (typically right after the PR was merged) the open PR is closed and
# its branch deleted, which keeps "at most one open i18n PR" true.
#
# Every run extracts the default branch, whatever ref it was started from. To
# see what a feature branch would extract, run `npm run i18n:extract` in
# privacyidea/static_new locally.
name: WebUI i18n extract
on:
  schedule:
    - cron: "0 2 * * *"

permissions: {}

jobs:
  extract:
    name: Extract strings and sync the i18n PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # force-push the bot branch
      pull-requests: write # open, update or close the i18n PR
    env:
      PR_BRANCH: chore/i18n-extract
      PR_LABEL: i18n
      PR_TITLE: "webui: extract i18n translation strings"
      LOCALE_DIR: privacyidea/static_new/src/locale
      PR_BASE: ${{ github.event.repository.default_branch }}
    steps:
      # Always the default branch, whatever ref started the run. Extracting the
      # starting ref instead would check that branch for drift and then act on
      # the bot PR, which tracks the default branch -- so a run from a feature
      # branch could close a PR whose base it never looked at.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record the extracted commit
        id: base
        # Not `github.sha`: that is the commit of the ref the run was started
        # from, not the one checked out above.
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/* # Use the latest LTS-release
          cache: npm
          cache-dependency-path: privacyidea/static_new/package-lock.json
      - name: Install Node.js dependencies
        run: npm ci
        working-directory: ./privacyidea/static_new
      - name: Extract and merge translation units
        # A duplicate id means two different messages share one `@@id`. Only one
        # of them survives extraction, so the localized build renders that one
        # in the other's place -- and the target files carry a translation that
        # no longer matches its source. Fail here rather than commit that.
        run: |
          set -o pipefail
          npm run i18n:extract 2>&1 | tee "$RUNNER_TEMP/extract.log"
          if grep -q 'Duplicate messages with id' "$RUNNER_TEMP/extract.log"; then
            sed -n '/Duplicate messages with id/,/^extracted translations/p' "$RUNNER_TEMP/extract.log" >&2
            echo "::error::Duplicate i18n message ids. Give each message its own @@id, or trim the"\
                 "edge whitespace so every occurrence extracts the same source."
            exit 1
          fi
        working-directory: ./privacyidea/static_new

      - name: Detect translation drift
        id: drift
        run: |
          set -euo pipefail
          # Stage first so a locale file the merger creates from scratch counts
          # as drift too, then read the diff back from the index.
          git add -A -- "$LOCALE_DIR"
          if git diff --cached --quiet -- "$LOCALE_DIR"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new or changed translation units."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --stat -- "$LOCALE_DIR" > "$RUNNER_TEMP/diffstat.txt"
          # Unit counts come from the source file: the target files always end
          # up with the same set, so one number is enough for the PR body.
          before=$(git show "HEAD:$LOCALE_DIR/messages.xlf" | grep -c '<trans-unit ' || true)
          after=$(grep -c '<trans-unit ' "$LOCALE_DIR/messages.xlf" || true)
          echo "units_before=$before" >> "$GITHUB_OUTPUT"
          echo "units_after=$after" >> "$GITHUB_OUTPUT"

      - name: Validate the merged translation files
        if: steps.drift.outputs.changed == 'true'
        # GitHub deliberately does not run workflows on a PR created with
        # GITHUB_TOKEN, so the usual PR checks stay silent on this branch. The
        # localized production build is the check that matters here: it parses
        # every target file and fails on malformed XLIFF or broken placeholders.
        run: npm run build -- --configuration production
        working-directory: ./privacyidea/static_new

      - name: Commit and force-push the bot branch
        id: push
        if: steps.drift.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Branch off the checked-out base commit, keeping the staged files, so
          # the branch is always exactly base + one extraction commit.
          git switch -c "$PR_BRANCH"
          git commit --quiet -m "$PR_TITLE"
          # Credentials are not persisted, so authenticate the push through the
          # remote URL. GITHUB_TOKEN is masked in the log by the runner.
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --no-tags --quiet "$remote" "refs/heads/$PR_BRANCH:refs/i18n/previous" 2>/dev/null \
             && git diff --quiet refs/i18n/previous HEAD -- "$LOCALE_DIR"; then
            # The open PR already carries exactly these translation files; skip
            # the push so it does not collect a no-op commit every night.
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Open PR is already up to date; nothing pushed."
            exit 0
          fi
          git push --force --quiet "$remote" "HEAD:refs/heads/$PR_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the i18n pull request
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UNITS_BEFORE: ${{ steps.drift.outputs.units_before }}
          UNITS_AFTER: ${{ steps.drift.outputs.units_after }}
          PUSHED: ${{ steps.push.outputs.pushed }}
        run: |
          set -euo pipefail

          # Ensure the label exists (idempotent; --force updates if present).
          gh label create "$PR_LABEL" --color 1d76db --description "WebUI translation files" --force \
            || { echo "::error::gh label create failed"; exit 1; }

          body="$RUNNER_TEMP/pr-body.md"
          {
            echo "Automated \`npm run i18n:extract\` of the new WebUI, run daily."
            echo
            echo "- Base: \`$PR_BASE\` at $BASE_SHA"
            echo "- Translation units in \`messages.xlf\`: $UNITS_BEFORE -> $UNITS_AFTER"
            echo "- Run: $RUN_URL"
            echo
            echo '```'
            cat "$RUNNER_TEMP/diffstat.txt"
            echo '```'
            echo
            echo "New units are added to every target locale with the English source as"
            echo "placeholder and \`state=\"new\"\`, so Weblate lists them as needing"
            echo "translation while the UI keeps falling back to English."
            echo
            echo "This branch is rebuilt from \`$PR_BASE\` and force-pushed on every run, so"
            echo "do not commit anything else to it. Because the PR is created with"
            echo "\`GITHUB_TOKEN\`, GitHub does not start the usual PR checks on it; the"
            echo "localized production build ran in the job linked above instead."
          } > "$body"

          # Look the PR up by head branch only, without a base filter, so the
          # single bot PR is found and updated no matter which base it targets.
          number=$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty') \
            || { echo "::error::gh pr list failed"; exit 1; }

          if [ -z "$number" ]; then
            gh pr create --base "$PR_BASE" --head "$PR_BRANCH" --title "$PR_TITLE" \
              --body-file "$body" --label "$PR_LABEL" \
              || { echo "::error::gh pr create failed"; exit 1; }
          else
            # Refresh the body even when nothing was pushed, so the PR shows
            # that it is still current rather than looking stale.
            gh pr edit "$number" --title "$PR_TITLE" --body-file "$body" --add-label "$PR_LABEL" \
              || { echo "::error::gh pr edit failed"; exit 1; }
            echo "Updated #$number (pushed=$PUSHED)."
          fi

      - name: Close the i18n pull request when nothing is left to extract
        if: steps.drift.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty') \
            || { echo "::error::gh pr list failed"; exit 1; }
          if [ -z "$number" ]; then
            echo "Nothing to extract and no open i18n PR; done."
            exit 0
          fi
          # A fresh extraction of the base branch produces no drift, so whatever
          # this PR still shows has already landed. Close it (and drop the
          # branch) to keep at most one open i18n PR.
          gh pr close "$number" \
            --comment "Superseded: a fresh extraction of \`$PR_BASE\` produces no changes, so these units already landed. Run: $RUN_URL" \
            --delete-branch \
            || { echo "::error::gh pr close failed"; exit 1; }

  notify-failure:
    needs: extract
    # Surface a broken extraction as a GitHub issue. Scheduled runs only: any
    # other run reports its failure where it was started from.
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # for actions/checkout to reach the local composite action
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-nightly-failure
        with:
          title: Nightly WebUI i18n extraction failed on ${{ github.event.repository.default_branch }}
          body: |
            The nightly WebUI i18n extraction (npm run i18n:extract) failed on
            ${{ github.event.repository.default_branch }},
            so the translation files were not updated.

            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}
