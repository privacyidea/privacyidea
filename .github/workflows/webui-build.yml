name: Build WebUI
on:
  pull_request:
    paths:
      - 'privacyidea/static/**'
  schedule:
    # Nightly at 01:00 UTC
    - cron: '0 1 * * *'

permissions:
  contents: read

defaults:
  run:
    working-directory: ./privacyidea/static

jobs:
  build-webui:
    name: npm run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for building the new WebUI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*  # Use the latest LTS-release
          cache: npm
          cache-dependency-path: privacyidea/static/package-lock.json
      - name: Install Node.js dependencies
        run: npm ci
      - name: Build the new WebUI
        run: npm run build
      # The server reads the application from <static folder>/dist/privacyidea-webui/browser/
      # and the base href is baked in at build time, so a build that lands anywhere else, or
      # addresses another URL, produces a WebUI that is never found. tests/test_ui_static_layout.py
      # checks the same contract from the Python side, but only this job has a real build.
      - name: Check the build output is where the server reads it
        run: |
          for locale in en de; do
            index="dist/privacyidea-webui/browser/${locale}/index.html"
            if [ ! -f "$index" ]; then
              echo "::error::The build did not produce ${index}"
              exit 1
            fi
          done
          base_href='base href="/static/dist/privacyidea-webui/browser/en/"'
          if ! grep -q "$base_href" "dist/privacyidea-webui/browser/en/index.html"; then
            echo "::error::The built index.html does not carry '${base_href}'"
            grep -o 'base href="[^"]*"' "dist/privacyidea-webui/browser/en/index.html" || true
            exit 1
          fi

  notify-failure:
    needs: build-webui
    # Surface nightly build breakage as a GitHub issue. Scheduled runs only —
    # PR failures already show up as PR checks.
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # for actions/checkout to reach the local composite action
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-nightly-failure
        with:
          title: Nightly WebUI build failed on master
          body: |
            The nightly WebUI build (npm run build) failed on master.

            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}
