#
# Builds the single-node Docker image and boots the full compose stack to verify
# it works end-to-end. Two layers of assurance:
#   1. Static checks  — shellcheck, hadolint, compose config, python syntax.
#   2. Build + smoke  — build the image, "compose up", then assert readiness,
#                       admin authentication, and that pi-cron is running; with
#                       the bundled MariaDB and with an external PostgreSQL.
#
# Everything runs on pull requests that touch deploy/docker itself — those are
# the changes most likely to break the deployment, and the feedback belongs in
# review. Changes on the application side (Python sources, dependencies) can
# break the image too, but a full build plus compose boot is too expensive to
# pay for on every backend PR, and no image is published from this repository.
# That drift is caught by the nightly run on master, which reports breakage as a
# GitHub issue.

name: Docker Build

on:
  pull_request:
    branches:
      - 'master'
      - 'branch-*'
    paths:
      - 'deploy/docker/**'
      - '.github/workflows/docker-build.yml'
      # What a distribution contains is decided here, and the image installs the package. A file
      # that stops being packaged breaks the image without touching anything under deploy/docker.
      - 'MANIFEST.in'
      - 'pyproject.toml'
  schedule:
    # Nightly at 03:00 UTC, after the nightly unit-test runs.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck shell scripts
        run: shellcheck deploy/docker/entrypoint.sh deploy/docker/scripts/*.sh

      - name: Lint Dockerfile (hadolint)
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e \
            hadolint --failure-threshold error - < deploy/docker/Dockerfile

      - name: Validate compose files
        working-directory: deploy/docker
        run: |
          # compose.yaml refuses to load without the config files "make init" creates.
          make init
          docker compose config --quiet
          COMPOSE_PROFILES=tls docker compose config --quiet
          COMPOSE_FILE=compose.yaml:compose.external-db.yaml docker compose config --quiet
          PI_IMAGE=privacyidea:ci docker compose -f compose.yaml -f compose.build.yaml config --quiet

      - name: Check that compose.yaml names one release
        working-directory: deploy/docker
        run: |
          # The containers warn when their image is another release than PI_COMPOSE_VERSION, so a release
          # that changes only one of the two would warn at every start.
          image="$(docker compose config --format json | jq -r '.services.pi.image')"
          compose_version="$(docker compose config --format json | jq -r '.services.pi.environment.PI_COMPOSE_VERSION')"
          if [ "${image##*:}" != "${compose_version}" ]; then
            echo "compose.yaml pulls ${image}, but its PI_COMPOSE_VERSION is ${compose_version}"
            exit 1
          fi

      - name: Check helper scripts compile
        run: python3 -m py_compile deploy/docker/cron-runner.py deploy/docker/enckey-canary.py

  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: static-checks
    env:
      # The image built from this commit. Every compose command below runs it through PI_IMAGE; without it,
      # compose.yaml would pull the release it names.
      PI_IMAGE: privacyidea:ci
    steps:
      # fetch-depth: 0 so setuptools-scm can derive the version from git tags
      # (the Dockerfile copies .git and builds the package with it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate throwaway secrets and config
        working-directory: deploy/docker
        run: |
          # Use the same target operators use, so CI can never drift from the
          # secrets and config files compose requires (this is what missed the
          # audit keypair before). Then pin a known admin password for the smoke
          # test to log in.
          make init
          printf 'smoke-test-admin-pw\n' > secrets/bootstrap_admin_password
          chmod 644 secrets/bootstrap_admin_password

      - name: Build image
        run: docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.build.yaml build

      - name: Start stack
        # "up -d" blocks on pi-init (service_completed_successfully) before
        # starting pi/pi-cron, so a fresh init failure fails this step.
        run: docker compose -f deploy/docker/compose.yaml up -d

      - name: Smoke test
        env:
          PI_SMOKE_PASSWORD: smoke-test-admin-pw
        run: ./deploy/docker/scripts/smoke-test.sh

      - name: Restart idempotency (existing DB → migrate, not re-create)
        # Second boot must detect the populated DB, run "db upgrade" (a no-op on a
        # fresh schema), and NOT re-stamp or fail. Guards the create_tables/upgrade
        # branch in entrypoint.sh.
        run: |
          docker compose -f deploy/docker/compose.yaml down
          docker compose -f deploy/docker/compose.yaml up -d
          # Read the logs into a variable rather than piping them into "grep -q", which exits on
          # the first match and leaves the writer failing on a closed pipe.
          init_logs="$(docker compose -f deploy/docker/compose.yaml logs pi-init)"
          case "${init_logs}" in
            *"Existing database detected"*) ;;
            *) echo "pi-init did not take the existing-database path on restart"
               echo "${init_logs}"
               exit 1 ;;
          esac

      - name: Smoke test after restart
        env:
          PI_SMOKE_PASSWORD: smoke-test-admin-pw
        run: ./deploy/docker/scripts/smoke-test.sh

      - name: Start an external PostgreSQL
        # The database for the external-database run below, on a network of its own.
        # Its password holds characters the URI has to carry percent-encoded.
        run: |
          docker network create pi-external-db
          docker run -d --name pi-external-postgres --network pi-external-db \
            -e POSTGRES_USER=pi -e 'POSTGRES_PASSWORD=p@ss:w/rd%' -e POSTGRES_DB=pi \
            --health-cmd 'pg_isready -U pi -d pi' --health-interval 2s --health-retries 60 \
            postgres:17
          for _ in $(seq 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pi-external-postgres)" = healthy ] && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become healthy"
          docker logs pi-external-postgres
          exit 1

      - name: External database
        # compose.external-db.yaml takes the bundled MariaDB out of the stack and reads the
        # URI from secrets/database_uri. The override only connects the privacyIDEA
        # containers to the network of the test database.
        working-directory: deploy/docker
        env:
          PI_SMOKE_PASSWORD: smoke-test-admin-pw
        run: |
          docker compose down -v
          printf '%s\n' 'postgresql+psycopg2://pi:p%40ss%3Aw%2Frd%25@pi-external-postgres:5432/pi' > secrets/database_uri
          chmod 644 secrets/database_uri
          cat > compose.override.yaml <<'EOF'
          services:
            pi-init:
              networks: [default, external-db]
            pi:
              networks: [default, proxy, external-db]
            pi-cron:
              networks: [default, external-db]
          networks:
            external-db:
              external: true
              name: pi-external-db
          EOF
          echo 'COMPOSE_FILE=compose.yaml:compose.external-db.yaml:compose.override.yaml' >> .env
          docker compose up -d
          services=$'\n'"$(docker compose ps -a --services)"$'\n'
          if [[ "${services}" == *$'\ndb\n'* ]]; then
            echo "the bundled db service was started with an external database"
            exit 1
          fi
          ./scripts/smoke-test.sh
          backup_output="$(./scripts/backup.sh)"
          case "${backup_output}" in
            *"not dumped"*) ;;
            *) echo "backup.sh did not skip the database dump with an external database"
               echo "${backup_output}"
               exit 1 ;;
          esac

      - name: Dump logs on failure
        if: failure()
        # In the deployment directory and without "-f", so that the compose files of the
        # external-database run are used once it has started.
        working-directory: deploy/docker
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v

  notify-failure:
    needs: [static-checks, build-and-smoke]
    # Surface nightly breakage as a GitHub issue. Scheduled runs only — PR
    # failures already show up as PR checks.
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # for actions/checkout to reach the local composite action
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-nightly-failure
        with:
          title: Nightly Docker build failed on master
          body: |
            The nightly Docker image build and compose smoke test failed on master.

            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}
