# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build html documentation in the doc/ directory with Sphinx
sphinx:
  configuration: doc/conf.py

# Also build HTMLZip, PDF and ePub
# TODO: do we need all these as well?
formats:
  - pdf

# Install the pinned dependencies for the documentation building process.
python:
  install:
    - requirements: doc/requirements.txt
    - method: pip
      path: .

# Rank the code documentation of the Python modules low in the search results, so that it does not crowd out the
# user documentation. The patterns match the built HTML files: modules/lib.html, modules/lib/*.html and modules/db.html.
search:
  ranking:
    modules/lib*: -8
    modules/db.html: -8
