<div
  aria-label="UI Settings"
  class="settings-container"
  i18n-aria-label>
  <h3 class="margin-8" i18n>UI Settings</h3>

  <div class="details-cards-grid">
    <app-details-card
      i18n-title
      title="Theme">
      <div class="settings-row">
        <label class="theme-toggle">
          <input
            (change)="toggleTheme()"
            [attr.aria-label]="themeToggleLabel()"
            [checked]="theme() === 'dark'"
            type="checkbox" />
          <span class="theme-toggle__button"></span>
          <span class="theme-toggle__label">
            <mat-icon>{{ theme() === "dark" ? "dark_mode" : "light_mode" }}</mat-icon>
          </span>
        </label>
      </div>
    </app-details-card>

    <app-details-card
      i18n-title
      title="Language">
      <div class="settings-row">
        <mat-form-field
          class="input-width-m"
          subscriptSizing="dynamic">
          <mat-select
            (selectionChange)="selectLocale($event.value)"
            [value]="preferredLocale()"
            aria-label="Language"
            i18n-aria-label>
            @for (locale of locales; track locale.code) {
              <mat-option [value]="locale.code">
                {{ locale.label }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </app-details-card>
  </div>
</div>
