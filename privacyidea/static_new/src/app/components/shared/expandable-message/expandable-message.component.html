@if (text()) {
  <span class="expandable-message">
    <span
      [class.expandable-message__text--clamped]="!expanded()"
      [id]="textId"
      class="expandable-message__text">
      {{ text() }}
    </span>
    @if (expandable()) {
      <button
        (click)="toggle()"
        [attr.aria-controls]="textId"
        [attr.aria-expanded]="expanded()"
        [attr.aria-label]="expanded() ? collapseLabel() : expandLabel()"
        class="expandable-message__toggle"
        mat-icon-button
        type="button">
        <mat-icon>{{ expanded() ? "expand_less" : "expand_more" }}</mat-icon>
      </button>
    }
  </span>
} @else {
  <span>-</span>
}
