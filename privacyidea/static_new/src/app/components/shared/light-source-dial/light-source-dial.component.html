<fieldset class="dial">
  <legend class="dial__hidden-text">{{ legend() }}</legend>
  @for (item of items(); track item.slot) {
    <label
      [class]="'dial__slot dial__slot--' + item.slot"
      [matTooltip]="item.label">
      <input
        (change)="pick.emit(item.value)"
        [checked]="selected() === item.value"
        [name]="groupName()"
        type="radio" />
      <span class="dial__hidden-text">{{ item.label }}</span>
    </label>
  }
  <span class="dial__glow"></span>
  <span class="dial__pointer"></span>
  <span class="dial__knob"></span>
</fieldset>
