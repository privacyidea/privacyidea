<ul class="info-list">
  @for (entry of entries(); track entry.key) {
    <li class="info-group">
      @if (entry.children) {
        <span class="info-key">{{ entry.key }}</span>
        <ul class="info-list info-sublist">
          <!-- Tracked by position: an element of a list has no key, so keys are not unique here. -->
          @for (child of entry.children; track $index) {
            <li>
              @if (child.key) {
                <span class="info-key">{{ child.key }}:</span>
              }
              {{ child.value }}
            </li>
          }
        </ul>
      } @else {
        <span class="info-key">{{ entry.key }}:</span> {{ entry.value }}
      }
    </li>
  }
</ul>
