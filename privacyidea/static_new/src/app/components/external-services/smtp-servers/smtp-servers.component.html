<div
  appScrollToTop
  class="smtp-servers-container">
  @if (tableState.showTable()) {
    <div class="filter-paginator-container">
      <mat-form-field
        appearance="fill"
        class="smtp-table-filter"
        subscriptSizing="dynamic">
        <mat-label i18n="@@smtpServer.filterSmtpServers">Filter SMTP Servers...</mat-label>
        <app-clearable-input
          (clearButtonClick)="resetFilter()"
          [showClearButton]="filterString().length > 0">
          <input
            #filterHTMLInputElement
            (input)="onFilterInput(filterHTMLInputElement.value)"
            [value]="filterString()"
            aria-label="Filter Input"
            i18n-aria-label="@@common.filterInput"
            i18n-placeholder="@@common.filterByNameType"
            matInput
            placeholder="Filter by name or type" />
        </app-clearable-input>
      </mat-form-field>
      <mat-paginator
        [length]="totalLength()"
        [pageSizeOptions]="pageSizeOptions()"
        [pageSize]="pageSizeOptions()[1]"
        showFirstLastButtons />
    </div>
    <div class="actions-container">
      <button
        (click)="onCreateNewServer()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">email</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n="@@common.createSmtpServer">Create SMTP Server</span>
      </button>
      <button
        (click)="deleteSelected()"
        [disabled]="!selector.hasSelection()"
        class="action-button-delete-secondary button-width-l"
        mat-stroked-button>
        <mat-icon>delete_sweep</mat-icon>
        <span i18n="@@common.delete">Delete</span>
      </button>
    </div>
    <table
      [dataSource]="smtpDataSource()"
      class="smtp-servers-table"
      mat-table
      matSort>
      <ng-container matColumnDef="select">
        <th
          *matHeaderCellDef
          class="table-checkbox"
          mat-header-cell>
          <mat-checkbox
            (change)="$event.checked ? selector.selectAllRows() : selector.deselectAllRows()"
            [checked]="selector.allRowsSelected()"
            [disabled]="!selector.hasVisibleRows()"
            [indeterminate]="selector.someRowsSelected()" />
        </th>
        <td
          *matCellDef="let row"
          class="table-checkbox"
          mat-cell>
          <mat-checkbox
            (change)="selector.setRowSelected(row, $event.checked)"
            (click)="$event.stopPropagation()"
            [checked]="selector.isRowSelected(row)" />
        </td>
      </ng-container>

      <ng-container matColumnDef="identifier">
        <th
          *matHeaderCellDef
          i18n="@@common.identifier"
          mat-header-cell
          mat-sort-header
          >Identifier</th
        >
        <td
          *matCellDef="let server"
          mat-cell>
          <app-copyable [copyText]="server.identifier">
            <a
              role="button"
              tabindex="0"
              (click)="onEditServer(server)"
              (keydown.enter)="onEditServer(server)"
              class="flex ali-center">
              {{ server.identifier }}
            </a>
          </app-copyable>
        </td>
      </ng-container>

      <ng-container matColumnDef="server">
        <th
          *matHeaderCellDef
          i18n="@@common.ipFqdnColumn"
          mat-header-cell
          mat-sort-header
          >IP/FQDN</th
        >
        <td
          *matCellDef="let server"
          mat-cell>
          {{ server.server }}:{{ server.port }}
        </td>
      </ng-container>

      <ng-container matColumnDef="sender">
        <th
          *matHeaderCellDef
          i18n="@@smtpServer.sender"
          mat-header-cell
          mat-sort-header
          >Sender</th
        >
        <td
          *matCellDef="let server"
          mat-cell>
          {{ server.sender }}
        </td>
      </ng-container>

      <ng-container matColumnDef="tls">
        <th
          *matHeaderCellDef
          i18n="@@smtpServer.starttls"
          mat-header-cell
          mat-sort-header
          >StartTLS</th
        >
        <td
          *matCellDef="let server"
          mat-cell>
          <div class="flex just-center">
            @if (server.tls) {
              <mat-icon>check</mat-icon>
            }
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th
          *matHeaderCellDef
          i18n="@@common.description"
          mat-header-cell
          mat-sort-header
          >Description</th
        >
        <td
          *matCellDef="let server"
          mat-cell>
          {{ server.description }}
        </td>
      </ng-container>

      <tr
        *matHeaderRowDef="displayedColumns"
        mat-header-row></tr>
      <tr
        *matRowDef="let row; columns: displayedColumns"
        mat-row></tr>

      <tr *matNoDataRow>
        <td colspan="6">
          <app-table-state
            [status]="tableState.rowStatus()"
            [table]="tableState" />
        </td>
      </tr>
    </table>
  } @else {
    <app-table-state
      [table]="tableState"
      heading="No SMTP servers yet"
      hint="Create an SMTP server to send emails and one-time passwords."
      i18n-heading="@@smtpServer.noSMTPServers"
      i18n-hint="@@smtpServer.createSMTPServer"
      icon="email">
      <button
        (click)="onCreateNewServer()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">email</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n="@@common.createSmtpServer">Create SMTP Server</span>
      </button>
    </app-table-state>
  }
</div>
