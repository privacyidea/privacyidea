<div
  appScrollToTop
  class="tokengroups-container">
  @if (tableState.showTable()) {
    <div class="filter-paginator-container">
      <mat-form-field
        appearance="fill"
        class="tokengroups-table-filter"
        subscriptSizing="dynamic">
        <mat-label i18n="@@tokenGroup.filterTokengroups">Filter Tokengroups...</mat-label>
        <app-clearable-input
          (clearButtonClick)="resetFilter()"
          [showClearButton]="filterString().length > 0">
          <input
            #filterHTMLInputElement
            (input)="onFilterInput(filterHTMLInputElement.value)"
            [value]="filterString()"
            aria-label="Filter Input"
            i18n-aria-label="@@common.filterInput"
            i18n-placeholder="@@common.filterByNameDescription"
            matInput
            placeholder="Filter by name or description" />
        </app-clearable-input>
      </mat-form-field>
      <mat-paginator
        [length]="totalLength()"
        [pageSizeOptions]="pageSizeOptions()"
        [pageSize]="pageSizeOptions()[1]"
        showFirstLastButtons />
    </div>
    <div class="actions-container">
      <button
        (click)="onCreateNewTokengroup()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">local_police</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n="@@tokenGroup.createTokenGroup">Create Token Group</span>
      </button>
      <button
        (click)="deleteSelected()"
        [disabled]="!selector.hasSelection()"
        class="action-button-delete-secondary button-width-l"
        mat-stroked-button>
        <mat-icon>delete_sweep</mat-icon>
        <span i18n="@@common.delete">Delete</span>
      </button>
    </div>
    <table
      [dataSource]="tokengroupDataSource()"
      class="tokengroups-table"
      mat-table
      matSort>
      <ng-container matColumnDef="select">
        <th
          *matHeaderCellDef
          class="table-checkbox"
          mat-header-cell>
          <mat-checkbox
            (change)="$event.checked ? selector.selectAllRows() : selector.deselectAllRows()"
            [checked]="selector.allRowsSelected()"
            [disabled]="!selector.hasVisibleRows()"
            [indeterminate]="selector.someRowsSelected()" />
        </th>
        <td
          *matCellDef="let row"
          class="table-checkbox"
          mat-cell>
          <mat-checkbox
            (change)="selector.setRowSelected(row, $event.checked)"
            (click)="$event.stopPropagation()"
            [checked]="selector.isRowSelected(row)" />
        </td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th
          *matHeaderCellDef
          i18n="@@common.idColumn"
          mat-header-cell
          mat-sort-header>
          Id
        </th>
        <td
          *matCellDef="let group"
          mat-cell>
          {{ group.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="groupname">
        <th
          *matHeaderCellDef
          i18n="@@common.name"
          mat-header-cell
          mat-sort-header>
          Name
        </th>
        <td
          *matCellDef="let group"
          mat-cell>
          <app-copyable [copyText]="group.groupname">
            <a
              role="button"
              tabindex="0"
              (click)="onEditTokengroup(group)"
              (keydown.enter)="onEditTokengroup(group)"
              class="flex ali-center">
              {{ group.groupname }}
            </a>
          </app-copyable>
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th
          *matHeaderCellDef
          i18n="@@common.description"
          mat-header-cell
          mat-sort-header>
          Description
        </th>
        <td
          *matCellDef="let group"
          mat-cell>
          {{ group.description }}
        </td>
      </ng-container>

      <tr
        *matHeaderRowDef="displayedColumns"
        mat-header-row></tr>
      <tr
        *matRowDef="let row; columns: displayedColumns"
        mat-row></tr>

      <tr *matNoDataRow>
        <td colspan="4">
          <app-table-state
            [status]="tableState.rowStatus()"
            [table]="tableState" />
        </td>
      </tr>
    </table>
  } @else {
    <app-table-state
      [table]="tableState"
      heading="No token groups yet"
      hint="Create a token group to group tokens for policies and machine assignments."
      i18n-heading="@@tokenGroup.noTokenGroups"
      i18n-hint="@@tokenGroup.createTokenGroup"
      icon="local_police">
      <button
        (click)="onCreateNewTokengroup()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">local_police</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n="@@tokenGroup.createTokenGroup">Create Token Group</span>
      </button>
    </app-table-state>
  }
</div>
