<div
  appScrollToTop
  class="ca-connectors-container">
  @if (tableState.showTable()) {
    <div class="filter-paginator-container">
      <mat-form-field
        appearance="fill"
        class="table-filter"
        subscriptSizing="dynamic">
        <mat-label i18n>Filter CA Connectors...</mat-label>
        <app-clearable-input
          (clearButtonClick)="resetFilter()"
          [showClearButton]="filterString().length > 0">
          <input
            #filterHTMLInputElement
            (input)="onFilterInput(filterHTMLInputElement.value)"
            [value]="filterString()"
            aria-label="Filter Input"
            i18n-aria-label
            i18n-placeholder
            matInput
            placeholder="Filter by name or type" />
        </app-clearable-input>
      </mat-form-field>
      <mat-paginator
        [length]="totalLength()"
        [pageSizeOptions]="pageSizeOptions()"
        [pageSize]="pageSizeOptions()[1]"
        showFirstLastButtons />
    </div>
    <div class="actions-container">
      <button
        (click)="openEditDialog()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">assured_workload</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n>Create CA Connector</span>
      </button>
      <button
        (click)="deleteSelected()"
        [disabled]="!selector.hasSelection()"
        class="action-button-delete-secondary button-width-l"
        mat-stroked-button>
        <mat-icon>delete_sweep</mat-icon>
        <span i18n>Delete</span>
      </button>
    </div>
    <table
      [dataSource]="caConnectorDataSource()"
      class="ca-connectors-table"
      mat-table
      matSort>
      <ng-container matColumnDef="select">
        <th
          *matHeaderCellDef
          class="table-checkbox"
          mat-header-cell>
          <mat-checkbox
            (change)="$event.checked ? selector.selectAllRows() : selector.deselectAllRows()"
            [checked]="selector.allRowsSelected()"
            [disabled]="!selector.hasVisibleRows()"
            [indeterminate]="selector.someRowsSelected()" />
        </th>
        <td
          *matCellDef="let row"
          class="table-checkbox"
          mat-cell>
          <mat-checkbox
            (change)="selector.setRowSelected(row, $event.checked)"
            (click)="$event.stopPropagation()"
            [checked]="selector.isRowSelected(row)" />
        </td>
      </ng-container>

      <ng-container matColumnDef="connectorname">
        <th
          *matHeaderCellDef
          i18n
          mat-header-cell
          mat-sort-header>
          CA Connector Name
        </th>
        <td
          *matCellDef="let connector"
          mat-cell>
          <app-copyable [copyText]="connector.connectorname">
            <a
              role="button"
              tabindex="0"
              (click)="openEditDialog(connector)"
              (keydown.enter)="openEditDialog(connector)"
              class="flex ali-center">
              {{ connector.connectorname }}
            </a>
          </app-copyable>
        </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th
          *matHeaderCellDef
          i18n
          mat-header-cell
          mat-sort-header>
          Type
        </th>
        <td
          *matCellDef="let connector"
          mat-cell>
          {{ connector.type }}
        </td>
      </ng-container>

      <tr
        *matHeaderRowDef="displayedColumns"
        mat-header-row></tr>
      <tr
        *matRowDef="let row; columns: displayedColumns"
        mat-row></tr>

      <tr *matNoDataRow>
        <td colspan="3">
          <app-table-state
            [status]="tableState.rowStatus()"
            [table]="tableState" />
        </td>
      </tr>
    </table>
  } @else {
    <app-table-state
      [table]="tableState"
      heading="No CA connectors yet"
      hint="Create a CA connector to issue and manage certificates from privacyIDEA."
      i18n-heading
      i18n-hint
      icon="assured_workload">
      <button
        (click)="openEditDialog()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">assured_workload</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n>Create CA Connector</span>
      </button>
    </app-table-state>
  }
</div>
