<app-details-card
  i18n-title="@@uiSettings.sessionMode"
  title="Session Mode">
  <div class="mode-row">
    <mat-form-field
      class="input-width-m"
      subscriptSizing="dynamic">
      <mat-select
        (selectionChange)="selectAuthSessionMode($event)"
        [value]="mode()"
        aria-label="Session Mode"
        i18n-aria-label="@@uiSettings.sessionMode">
        @for (option of modeOptions(); track option.value) {
          <mat-option [value]="option.value">
            {{ option.label }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-icon
      [attr.aria-label]="modeHint()"
      [matTooltip]="modeHint()"
      class="mode-hint"
      >info_outline</mat-icon
    >
  </div>
</app-details-card>
