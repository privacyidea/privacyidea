<div
  #scrollContainer
  class="edit-policy-layout">
  <h3 class="margin-8">
    {{ title() }}
  </h3>

  <div
    class="sticky-header"
    [appStickyHeader]="scrollContainer">
    <div class="sticky-controls ali-center">
      <button
        (click)="onCancel()"
        class="action-button-secondary button-width-s"
        mat-stroked-button>
        <span i18n="@@common.cancel">Cancel</span>
      </button>
      <button
        (click)="onSave()"
        [disabled]="!canSave()"
        class="action-button-primary button-width-s"
        mat-stroked-button>
        <mat-icon>save</mat-icon>
        <span i18n="@@common.save">Save</span>
      </button>

      @if (activeTab() === "actions") {
        <mat-form-field
          class="action-search-field"
          subscriptSizing="dynamic">
          <mat-label i18n="@@policy.searchActionsLabel">Search actions</mat-label>
          <app-clearable-input
            (clearButtonClick)="actionFilter.set('')"
            [showClearButton]="actionFilter() !== ''">
            <input
              matInput
              type="text"
              [value]="actionFilter()"
              (input)="actionFilter.set($any($event.target).value)" />
          </app-clearable-input>
        </mat-form-field>
      }
    </div>
  </div>

  @if (mode() === "create") {
    <app-policy-template-picker
      [currentPriority]="editedPolicy().priority"
      (templateApplied)="addPolicyEdit($event)"></app-policy-template-picker>
  }

  <app-policy-panel-edit
    [policy]="editedPolicy()"
    [(activeTab)]="activeTab"
    [(actionFilter)]="actionFilter"
    (policyEdit)="addPolicyEdit($event)"></app-policy-panel-edit>
</div>
