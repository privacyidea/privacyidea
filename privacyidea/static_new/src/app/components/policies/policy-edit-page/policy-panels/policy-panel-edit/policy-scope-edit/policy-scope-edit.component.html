<div
  class="action-scope-container"
  [matTooltip]="lockedHint"
  [matTooltipDisabled]="!disabled()">
  <mat-form-field>
    <mat-label i18n="@@common.scope">Scope</mat-label>
    <mat-select
      [value]="scope()"
      [disabled]="disabled()"
      [panelClass]="'single-column-panel'"
      (selectionChange)="scopeChange.emit($event.value)">
      <mat-option
        class="select-option"
        [value]="''"
        i18n="@@policy.allScopes"
        >All scopes</mat-option
      >
      @for (scopeName of allPolicyScopes(); track scopeName) {
        <mat-option
          class="select-option"
          [value]="scopeName"
          >{{ scopeName }}</mat-option
        >
      }
    </mat-select>
  </mat-form-field>
</div>
