<div class="appearance-widget">
  <div class="appearance-widget__row">
    <app-theme-toggle />

    <app-light-source-dial
      [items]="items"
      [selected]="selected()"
      groupName="appearance-preset"
      legend="Appearance preset"
      i18n-legend
      (pick)="selectPreset($event)" />

    <button
      (click)="resetAppearance()"
      [attr.aria-label]="resetTooltip"
      [matTooltip]="resetTooltip"
      mat-icon-button
      type="button">
      <mat-icon>restart_alt</mat-icon>
    </button>
  </div>
</div>
