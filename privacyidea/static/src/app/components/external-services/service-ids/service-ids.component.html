<div
  appScrollToTop
  class="service-ids-container">
  @if (tableState.showTable()) {
    <div class="filter-paginator-container">
      <div class="filter-actions-group">
        <mat-form-field
          appearance="fill"
          class="table-filter"
          subscriptSizing="dynamic">
          <mat-label i18n="@@serviceId.filterService">Filter Service IDs...</mat-label>
          <app-clearable-input
            (clearButtonClick)="resetFilter()"
            [showClearButton]="filterString().length > 0">
            <input
              #filterHTMLInputElement
              [appRefocusAfterReload]="serviceIdService.serviceIdResource.isLoading()"
              (input)="onFilterInput(filterHTMLInputElement.value)"
              [value]="filterString()"
              aria-label="Filter Input"
              i18n-aria-label="@@common.filterInput"
              i18n-placeholder="@@common.filterByNameDescription"
              matInput
              placeholder="Filter by name or description" />
          </app-clearable-input>
        </mat-form-field>
        <button
          [matMenuTriggerFor]="tableActionsMenu"
          aria-label="Actions"
          class="table-actions-trigger margin-left-8"
          i18n-aria-label="@@common.actions"
          i18n-matTooltip="@@common.actions"
          mat-icon-button
          matTooltip="Actions">
          <span class="icon-badge">
            <mat-icon>menu</mat-icon>
            <mat-icon class="icon-badge-overlay icon-badge-corner">build</mat-icon>
          </span>
        </button>
      </div>
      <mat-paginator
        appPaginatorCompactRange
        [length]="totalLength()"
        [pageSizeOptions]="pageSizeOptions()"
        [pageSize]="pageSizeOptions()[1]"
        showFirstLastButtons />
    </div>
    <div class="actions-row margin-bottom-16">
      <div class="actions-row-inner">
        <div class="actions-container">
          <button
            (click)="onCreateNewServiceId()"
            class="action-button-primary button-width-l"
            mat-stroked-button>
            <span class="icon-badge">
              <mat-icon class="padding-right-3">storage</mat-icon>
              <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
            </span>
            <span i18n="@@common.createService">Create Service ID</span>
          </button>
          <button
            (click)="deleteSelected()"
            [disabled]="!selector.hasSelection()"
            class="action-button-delete-secondary button-width-l"
            mat-stroked-button>
            <mat-icon>delete_sweep</mat-icon>
            <span i18n="@@common.delete">Delete</span>
          </button>

          <p
            class="margin-bottom-0 margin-top-0"
            i18n="@@serviceId.serviceIdsUsed"
            >Service IDs can be used to attach e.g. SSH keys to certain machines and services. <br />
            To view attached tokens go to <a [routerLink]="[ROUTE_PATHS.TOKENS_APPLICATIONS]">token applications.</a></p
          >
        </div>
      </div>
    </div>

    <div
      appScrollEdges
      class="table-scroll-region">
      <table
        aria-label="Service IDs"
        i18n-aria-label="@@table.serviceIds"
        [dataSource]="serviceIdDataSource()"
        class="service-ids-table"
        mat-table
        matSort>
          <ng-container matColumnDef="select">
          <th
            *matHeaderCellDef
            class="table-checkbox"
            mat-header-cell>
            <mat-checkbox
              aria-label="Select all rows"
              i18n-aria-label="@@common.selectAllRows"
              (change)="$event.checked ? selector.selectAllRows() : selector.deselectAllRows()"
              [checked]="selector.allRowsSelected()"
              [disabled]="!selector.hasVisibleRows()"
              [indeterminate]="selector.someRowsSelected()" />
          </th>
          <td
            *matCellDef="let row"
            class="table-checkbox"
            mat-cell>
            <mat-checkbox
              aria-label="Select row"
              i18n-aria-label="@@common.selectRow"
              (change)="selector.setRowSelected(row, $event.checked)"
              (click)="$event.stopPropagation()"
              [checked]="selector.isRowSelected(row)" />
          </td>
        </ng-container>

        <ng-container matColumnDef="id">
          <th
            *matHeaderCellDef
            [ngClass]="'col-width-s'"
            i18n="@@common.idColumn"
            mat-header-cell
            mat-sort-header
            >Id</th
          >
          <td
            *matCellDef="let service"
            [ngClass]="'col-width-s'"
            mat-cell>
            {{ service.id }}
          </td>
        </ng-container>

        <ng-container matColumnDef="servicename">
          <th
            *matHeaderCellDef
            [ngClass]="'col-width-m'"
            i18n="@@common.name"
            mat-header-cell
            mat-sort-header
            >Name</th
          >
          <td
            *matCellDef="let service"
            [ngClass]="'col-width-m'"
            mat-cell>
            <app-copyable [copyText]="service.servicename">
              <a
                role="button"
                tabindex="0"
                (click)="onEditServiceId(service)"
                (keydown.enter)="onEditServiceId(service)"
                class="flex ali-center">
                {{ service.servicename }}
              </a>
            </app-copyable>
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th
            *matHeaderCellDef
            [ngClass]="'col-width-xl'"
            i18n="@@common.description"
            mat-header-cell
            mat-sort-header
            >Description</th
          >
          <td
            *matCellDef="let service"
            [ngClass]="'col-width-xl'"
            mat-cell>
            {{ service.description }}
          </td>
        </ng-container>

        <tr
          *matHeaderRowDef="displayedColumns; sticky: true"
          mat-header-row></tr>
        <tr
          *matRowDef="let row; columns: displayedColumns"
          mat-row></tr>

        <tr *matNoDataRow>
          <td colspan="4">
            <app-table-state
              [status]="tableState.rowStatus()"
              [table]="tableState" />
          </td>
        </tr>
      </table>
    </div>
  } @else {
    <app-table-state
      [table]="tableState"
      heading="No service IDs yet"
      hint="Create a service ID to attach SSH tokens to it."
      i18n-heading="@@serviceId.noServiceIDs"
      i18n-hint="@@serviceId.createServiceID"
      icon="storage">
      <button
        (click)="onCreateNewServiceId()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">storage</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n="@@common.createService">Create Service ID</span>
      </button>
    </app-table-state>
  }
</div>

<mat-menu #tableActionsMenu="matMenu">
  <button
    (click)="onCreateNewServiceId()"
    mat-menu-item>
    <mat-icon>storage</mat-icon>
    <span i18n="@@common.createService">Create Service ID</span>
  </button>
  <button
    (click)="deleteSelected()"
    [disabled]="!selector.hasSelection()"
    mat-menu-item>
    <mat-icon>delete_sweep</mat-icon>
    <span i18n="@@common.delete">Delete</span>
  </button>
</mat-menu>
