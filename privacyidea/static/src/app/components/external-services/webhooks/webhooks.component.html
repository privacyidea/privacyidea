<div
  appScrollToTop
  class="webhooks-container">
  @if (tableState.showTable()) {
    <div class="filter-paginator-container">
      <mat-form-field
        appearance="fill"
        class="webhook-table-filter"
        subscriptSizing="dynamic">
        <mat-label i18n="@@webhook.filterWebhooks">Filter Webhooks...</mat-label>
        <app-clearable-input
          (clearButtonClick)="resetFilter()"
          [showClearButton]="filterString().length > 0">
          <input
            #filterHTMLInputElement
            (input)="onFilterInput(filterHTMLInputElement.value)"
            [value]="filterString()"
            aria-label="Filter Input"
            i18n-aria-label="@@common.filterInput"
            i18n-placeholder="@@common.filterByNameType"
            matInput
            placeholder="Filter by name or type" />
        </app-clearable-input>
      </mat-form-field>
      <mat-paginator
        [length]="totalLength()"
        [pageSizeOptions]="pageSizeOptions()"
        [pageSize]="pageSizeOptions()[1]"
        showFirstLastButtons />
    </div>
    <div class="actions-container">
      <button
        (click)="onCreateNewWebhook()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">webhook</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n="@@webhook.createWebhook">Create Webhook</span>
      </button>
      <button
        (click)="deleteSelected()"
        [disabled]="!selector.hasSelection()"
        class="action-button-delete-secondary button-width-l"
        mat-stroked-button>
        <mat-icon>delete_sweep</mat-icon>
        <span i18n="@@common.delete">Delete</span>
      </button>
    </div>
    <table
      [dataSource]="webhookDataSource()"
      class="webhooks-table"
      mat-table
      matSort>
      <ng-container matColumnDef="select">
        <th
          *matHeaderCellDef
          class="table-checkbox"
          mat-header-cell>
          <mat-checkbox
            (change)="$event.checked ? selector.selectAllRows() : selector.deselectAllRows()"
            [checked]="selector.allRowsSelected()"
            [disabled]="!selector.hasVisibleRows()"
            [indeterminate]="selector.someRowsSelected()" />
        </th>
        <td
          *matCellDef="let row"
          class="table-checkbox"
          mat-cell>
          <mat-checkbox
            (change)="selector.setRowSelected(row, $event.checked)"
            (click)="$event.stopPropagation()"
            [checked]="selector.isRowSelected(row)" />
        </td>
      </ng-container>

      <ng-container matColumnDef="identifier">
        <th
          *matHeaderCellDef
          i18n="@@common.identifier"
          mat-header-cell
          mat-sort-header>Identifier
        </th>
        <td
          *matCellDef="let webhook"
          mat-cell>
          <app-copyable [copyText]="webhook.identifier">
            <a
              (click)="onEditWebhook(webhook)"
              (keydown.enter)="onEditWebhook(webhook)"
              class="flex ali-center"
              role="button"
              tabindex="0">
              {{ webhook.identifier }}
            </a>
          </app-copyable>
        </td>
      </ng-container>

      <ng-container matColumnDef="url">
        <th
          *matHeaderCellDef
          i18n="@@webhook.url"
          mat-header-cell
          mat-sort-header>URL
        </th>
        <td
          *matCellDef="let webhook"
          mat-cell>
          <div
            [matTooltip]="webhook.url"
            class="webhook-url">
            {{ webhook.url }}
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="http_method">
        <th
          *matHeaderCellDef
          i18n="@@webhook.httpMethod"
          mat-header-cell
          mat-sort-header>Method
        </th>
        <td
          *matCellDef="let webhook"
          mat-cell>
          {{ webhook.http_method }}
        </td>
      </ng-container>

      <ng-container matColumnDef="auth_type">
        <th
          *matHeaderCellDef
          i18n="@@webhook.authType"
          mat-header-cell
          mat-sort-header>Authentication
        </th>
        <td
          *matCellDef="let webhook"
          mat-cell>
          {{ webhook.auth_type }}
        </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th
          *matHeaderCellDef
          i18n="@@common.description"
          mat-header-cell
          mat-sort-header>Description
        </th>
        <td
          *matCellDef="let webhook"
          mat-cell>
          {{ webhook.description }}
        </td>
      </ng-container>

      <tr
        *matHeaderRowDef="displayedColumns"
        mat-header-row></tr>
      <tr
        *matRowDef="let row; columns: displayedColumns"
        mat-row></tr>

      <tr *matNoDataRow>
        <td colspan="6">
          <app-table-state
            [status]="tableState.rowStatus()"
            [table]="tableState" />
        </td>
      </tr>
    </table>
  } @else {
    <app-table-state
      [table]="tableState"
      heading="No webhooks yet"
      hint="Create a webhook to notify another system from an event handler or a conditional access policy."
      i18n-heading="@@webhook.noWebhooks"
      i18n-hint="@@webhook.createWebhookHint"
      icon="webhook">
      <button
        (click)="onCreateNewWebhook()"
        class="action-button-primary button-width-l"
        mat-stroked-button>
        <span class="icon-badge">
          <mat-icon class="padding-right-3">webhook</mat-icon>
          <mat-icon class="icon-badge-overlay icon-badge-bold">add</mat-icon>
        </span>
        <span i18n="@@webhook.createWebhook">Create Webhook</span>
      </button>
    </app-table-state>
  }
</div>
