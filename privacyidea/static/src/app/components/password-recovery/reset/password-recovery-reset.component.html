<div
  aria-label="Password Reset Container"
  class="login-container"
  i18n-aria-label="@@passwordRecovery.resetContainer">
  <div class="login-scroll">
    <app-login-logo />

    <form
      (submit)="$event.preventDefault(); onSubmit()"
      aria-label="Password Reset Form"
      class="login-form gap-16"
      i18n-aria-label="@@passwordRecovery.resetForm">
      <p
        class="margin-top-0"
        i18n="@@passwordRecovery.resetInstructions"
        >Set a new password for <strong>{{ account.user }}</strong
        >.</p
      >

      <div class="login-message-container login-message-container--tall">
        @if (errorMessage()) {
          <div class="error-message">
            <p>{{ errorMessage() }}</p>
          </div>
        }
      </div>

      <mat-form-field
        appearance="outline"
        subscriptSizing="dynamic">
        <mat-label i18n="@@passwordRecovery.newPassword">New password</mat-label>
        <input
          [formField]="passwordField"
          [type]="hidePassword() ? 'password' : 'text'"
          autocomplete="new-password"
          id="password"
          matInput />
        <button
          (click)="hidePassword.set(!hidePassword())"
          [attr.aria-label]="hidePassword() ? showPasswordLabel : hidePasswordLabel"
          mat-icon-button
          matSuffix
          type="button">
          <mat-icon>{{ hidePassword() ? "visibility" : "visibility_off" }}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field
        appearance="outline"
        subscriptSizing="dynamic">
        <mat-label i18n="@@passwordRecovery.repeatPassword">Repeat password</mat-label>
        <input
          [formField]="repeatPasswordField"
          [type]="hidePassword() ? 'password' : 'text'"
          autocomplete="new-password"
          id="repeat-password"
          matInput />
        @if (passwordMismatch()) {
          <mat-error i18n="@@passwordRecovery.passwordsDoNotMatch">The passwords do not match.</mat-error>
        }
      </mat-form-field>

      <div class="login-actions margin-top-16">
        <button
          [disabled]="isSubmitDisabled()"
          aria-label="Set Password Button"
          class="login-btn"
          extended
          i18n-aria-label="@@passwordRecovery.setPasswordButton"
          mat-fab
          type="submit">
          <span i18n="@@passwordRecovery.setPasswordButtonText">Set Password</span>
          <mat-icon iconPositionEnd>lock_reset</mat-icon>
        </button>
        <a
          [routerLink]="loginPath"
          aria-label="Cancel"
          class="reset-btn"
          extended
          i18n-aria-label="@@passwordRecovery.cancel"
          mat-fab>
          <span i18n="@@common.cancel">Cancel</span>
        </a>
      </div>
    </form>
  </div>
</div>
