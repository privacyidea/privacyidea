<div class="audit-range-clear">
  <button
    mat-button
    type="button"
    [disabled]="!hasRange()"
    (click)="clear()">
    <mat-icon>filter_alt_off</mat-icon>
    <span i18n="@@common.clearFilter">Clear Filter</span>
  </button>
  <mat-checkbox
    [checked]="timeMode()"
    (change)="onTimeModeChange($event.checked)"
    i18n="@@audit.selectTime"
    >Time</mat-checkbox
  >
</div>
<mat-calendar-header />
