<div class="conditions-container">
  <h2
    class="conditions-title"
    i18n="@@policy.usersConditions"
    >Users Conditions</h2
  >

  <app-multi-select-only
    class="margin-bottom-16"
    fieldClass="input-width-xl"
    label="Select Realms"
    [items]="availableRealms()"
    [selectedItems]="selectedRealms()"
    [tooltipText]="selectRealmTooltip()"
    (selectionChange)="selectRealm($event)">
  </app-multi-select-only>

  <app-multi-select-only
    class="margin-bottom-16"
    fieldClass="input-width-xl"
    label="Select Resolvers"
    [items]="availableResolvers()"
    [selectedItems]="selectedResolvers()"
    [tooltipText]="selectResolverTooltip()"
    (selectionChange)="selectResolver($event)">
  </app-multi-select-only>

  <app-chip-list-input
    fieldClass="input-width-xl"
    label="Add User"
    i18n-label="@@policy.addUser"
    gridLabel="Users"
    i18n-gridLabel="@@policy.usersGrid"
    [values]="selectedUsers()"
    (valuesChange)="emitEdits({ user: $event })">
    <ng-container chipListExtras>
      @if (selectedUsers().length > 0) {
        <mat-checkbox
          [formField]="caseInsensitiveField"
          color="primary">
          <span i18n="@@policy.caseInsensitive">Case insensitive</span>
        </mat-checkbox>

        <button
          mat-stroked-button
          class="action-button-secondary button-width-m"
          (click)="clearUsers()">
          <mat-icon>clear_all</mat-icon>
          <span i18n="@@policy.clearUsers">Clear users</span>
        </button>
      }
    </ng-container>
  </app-chip-list-input>
</div>
