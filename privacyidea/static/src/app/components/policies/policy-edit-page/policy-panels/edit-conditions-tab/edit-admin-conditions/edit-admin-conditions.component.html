<div class="conditions-container">
  <h2
    class="conditions-title"
    i18n="@@policy.adminConditions"
    >Admin Conditions</h2
  >

  <app-multi-select-only
    class="margin-bottom-16"
    fieldClass="input-width-xl"
    label="Admin Realms"
    [items]="realmService.adminRealmOptions()"
    [selectedItems]="selectedAdminrealm()"
    (selectionChange)="selectAdminRealm($event)">
  </app-multi-select-only>

  <app-chip-list-input
    fieldClass="input-width-xl"
    label="Admin Name"
    i18n-label="@@policy.adminName"
    gridLabel="Admin users"
    i18n-gridLabel="@@policy.adminUsersGrid"
    [values]="selectedAdmins()"
    (valuesChange)="updatePolicy({ adminuser: $event })" />
</div>
