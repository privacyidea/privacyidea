<div class="policy-panel-edit-container">
  <div class="policy-metadata-group">
    <div class="name-scope-priority-row">
      <app-policy-name-edit
        class="input-width-l"
        [policyName]="editedPolicy().name"
        [nameTaken]="nameTaken()"
        (policyNameChange)="addPolicyEdit({ name: $event })" />
      <app-policy-scope-edit
        class="input-width-m"
        [scope]="editedPolicy().scope"
        [disabled]="policyHasActions()"
        (scopeChange)="onPolicyScopeChange($event)" />
      <app-policy-priority-edit
        class="input-width-s"
        [priority]="editedPolicy().priority"
        (priorityChange)="onPriorityChange($event)" />
    </div>

    <app-policy-description-edit
      class="input-width-xxl"
      [description]="editedPolicy().description ?? ''"
      (descriptionChange)="addPolicyEdit({ description: $event })" />
  </div>

  <mat-tab-group
    class="policy-tabs"
    animationDuration="0ms"
    aria-label="Policy sections"
    i18n-aria-label="@@policy.sectionTabsLabel"
    [selectedIndex]="tabIndex()"
    (selectedIndexChange)="onTabIndexChange($event)">
    <mat-tab label="Actions" i18n-label="@@common.actions">
      <ng-template matTabContent>
        <div class="tab-container">
          <app-edit-action-tab
            [policy]="editedPolicy()"
            [(actionFilter)]="actionFilter"
            [searchInHeader]="searchInHeader()"
            (actionsUpdate)="updateActions($event)"
            (policyScopeChange)="onPolicyScopeChange($event)" />
        </div>
      </ng-template>
    </mat-tab>
    <mat-tab label="Conditions" i18n-label="@@common.conditions">
      <ng-template matTabContent>
        <div class="tab-container">
          <app-edit-conditions-tab
            [policy]="editedPolicy()"
            (policyEdit)="addPolicyEdit($event)" />
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
