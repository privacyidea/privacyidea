<div
  #scrollContainer
  appScrollToTop
  (scroll)="updateSearchReached()"
  class="edit-policy-layout">
  <h3 class="margin-8">
    {{ title() }}
  </h3>

  <div
    #stickyHeader
    class="sticky-header"
    [appStickyHeader]="scrollContainer">
    <div class="sticky-controls ali-center">
      @if (mode() === "edit" && authService.actionAllowed("policydelete")) {
        <button
          (click)="deletePolicy()"
          class="action-button-delete-secondary button-width-s"
          mat-stroked-button>
          <mat-icon>delete</mat-icon>
          <span i18n="@@common.delete">Delete</span>
        </button>
      }
      <button
        (click)="onCancel()"
        class="action-button-secondary button-width-s"
        mat-stroked-button>
        <span i18n="@@common.cancel">Cancel</span>
      </button>
      <button
        (click)="onSave()"
        [disabled]="!canSave()"
        class="action-button-primary button-width-s"
        mat-stroked-button>
        <mat-icon>save</mat-icon>
        <span i18n="@@common.save">Save</span>
      </button>

      <!-- Only once the header reaches the field in the actions tab: until then it sits there,
           above the two panels it filters. -->
      @if (searchInHeader()) {
        <app-policy-action-search
          class="action-search-field"
          [(actionFilter)]="actionFilter" />
      }
    </div>
  </div>

  @if (mode() === "create") {
    <app-policy-template-picker
      #templatePicker
      [currentPriority]="editedPolicy().priority"
      (templateApplied)="addPolicyEdit($event)"></app-policy-template-picker>
  }

  <app-policy-panel-edit
    #panel
    [policy]="editedPolicy()"
    [(activeTab)]="activeTab"
    [(actionFilter)]="actionFilter"
    [searchInHeader]="searchInHeader()"
    (policyEdit)="addPolicyEdit($event)"></app-policy-panel-edit>
</div>
