<mat-form-field subscriptSizing="dynamic">
  <mat-label i18n="@@policy.searchActionsLabel">Search actions</mat-label>
  <app-clearable-input
    (clearButtonClick)="actionFilter.set('')"
    [showClearButton]="actionFilter() !== ''">
    <input
      matInput
      type="text"
      [value]="actionFilter()"
      (input)="actionFilter.set($any($event.target).value)" />
  </app-clearable-input>
</mat-form-field>
