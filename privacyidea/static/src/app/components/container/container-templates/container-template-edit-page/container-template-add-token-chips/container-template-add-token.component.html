<mat-card class="add-token-chips-card">
  <mat-card-title i18n="@@container.addNewToken">Add New Token</mat-card-title>
  <mat-card-content>
    @if (tokenTypes().length) {
      <mat-chip-set>
        @for (type of tokenTypes(); track type) {
          <mat-chip class="clickable-chip">
            <button
              class="chip-action"
              type="button"
              (click)="addToken(type)">
              {{ _toTitleCase(type) }}
              <mat-icon>add</mat-icon>
            </button>
          </mat-chip>
        }
      </mat-chip-set>
    }
  </mat-card-content>
</mat-card>
