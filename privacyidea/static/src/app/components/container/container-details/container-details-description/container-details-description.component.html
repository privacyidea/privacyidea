<app-details-card
  class="details-card--description"
  [class.is-editing]="field.isEditing()"
  title="Description"
  i18n-title="@@common.description">
  <div class="value-row">
    <div class="value-content">
      @if (field.isEditing()) {
        <mat-form-field
          class="input-width-xl"
          subscriptSizing="dynamic">
          <textarea
            [formField]="descriptionForm"
            i18n-placeholder="@@common.enterDescription"
            matInput
            placeholder="Enter description"
            rows="3"></textarea>
        </mat-form-field>
      } @else {
        <span class="description-text">{{ description() || "-" }}</span>
      }
    </div>
    <div class="value-edit">
      @if (editable()) {
        <app-edit-buttons
          [cancelEdit]="field.cancel"
          [element]="field.editButtonsElement"
          [isEditingInfo]="false"
          [isEditingUser]="false"
          [saveEdit]="field.commit"
          [shouldHideEdit]="blockEditing()"
          [toggleEdit]="field.toggle"></app-edit-buttons>
      }
    </div>
  </div>
</app-details-card>
