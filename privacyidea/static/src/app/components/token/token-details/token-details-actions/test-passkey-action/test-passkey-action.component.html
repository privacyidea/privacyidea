<ng-content select="[panelTitle]"></ng-content>
<button
  (click)="testPasskey()"
  class="action-button-secondary button-width-l"
  mat-stroked-button>
  <mat-icon>key</mat-icon>
  <span i18n="@@token.testPasskey">Test Passkey</span>
</button>
@if (result(); as result) {
  <p
    class="passkey-test-result"
    [class.passkey-test-result--success]="result.kind === 'success'"
    [class.passkey-test-result--warning]="result.kind === 'warning'">
    {{ result.message }}
    @if (result.mismatch; as mismatch) {
      <br />
      <span i18n="@@token.matchedToken">Matched token:</span>
      <a [routerLink]="[ROUTE_PATHS.TOKENS_DETAILS, mismatch.serial]">{{ mismatch.serial }}</a>
      @if (mismatch.username) {
        <span i18n="@@token.user">, user:</span>
        @if (mismatch.realm) {
          <a
            [routerLink]="[ROUTE_PATHS.USERS_DETAILS, mismatch.username]"
            [queryParams]="{ realm: mismatch.realm }">
            {{ mismatch.username }}&#64;{{ mismatch.realm }}
          </a>
        } @else {
          <span>{{ mismatch.username }}</span>
        }
      }
    }
  </p>
}
