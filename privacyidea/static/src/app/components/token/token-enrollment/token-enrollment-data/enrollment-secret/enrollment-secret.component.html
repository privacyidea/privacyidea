<div class="enrollment-secret">
  @if (hint()) {
    <p>{{ hint() }}</p>
  }
  <!-- Masked until asked for, so it is not exposed to anyone glancing at the screen or to a screen recording. -->
  <div class="inline-callout enrollment-secret__value">
    <span>{{ label() }}:</span>
    <code>{{ visible() ? value() : masked() }}</code>
    <button
      (click)="toggleVisible()"
      [attr.aria-label]="toggleLabel()"
      class="enrollment-secret__toggle"
      type="button">
      <mat-icon class="enrollment-secret__toggle-icon">{{ visible() ? "visibility_off" : "visibility" }}</mat-icon>
    </button>
    <app-copy-button
      (copyClicked)="saved.emit()"
      [copyText]="value()" />
  </div>
</div>
