<app-dialog-wrapper
  width="l"
  title="Complete Token Enrollment"
  i18n-title="@@token.completeToken"
  [actions]="dialogActions()"
  [showCloseButton]="!canCancelEnrollment()"
  (actionTriggered)="onDialogAction($event)"
  cancelButtonLabel="Close"
  i18n-cancelButtonLabel="@@common.close">
  <app-token-enrolled-text
    [serial]="enrollDetails?.serial"
    [containerSerial]="enrollParameters.data.containerSerial"
    [username]="enrollParameters.data.user"
    [userRealm]="enrollParameters.data.realm"
    [onlyAddToRealm]="enrollParameters.data.onlyAddToRealm"
    [rollover]="data.rollover ?? false"
    state="incomplete"
    [summaryOnly]="wizard"
    [confirmLeave]="confirmLeave"></app-token-enrolled-text>

  <app-enrollment-customization-frame
    [enabled]="wizard"
    [enrollmentDetail]="enrollDetails">
    @if (data.response) {
      <app-token-enrollment-data
        (enrollmentResponseChange)="onEnrollmentResponseChange($event)"
        [enrolledInputData]="data.response.detail"
        [compact]="wizard"
        [tokenType]="tokenType"
        [enrollmentParameters]="enrollParameters"></app-token-enrollment-data>
    }

    @if (twoStepEnrollment()) {
      <div class="margin-top-16">
        <div i18n="@@token.pleaseScanQrCode"
          >Please scan the QR code with the privacyIDEA Authenticator app and enter the generated code below.</div
        >
        <mat-form-field class="input-width-l">
          <mat-label i18n="@@token.clientPart">Client Part</mat-label>
          <input
            [formField]="clientPartForm"
            matInput />
          <mat-hint i18n="@@token.codeGenerated">Code generated by the Authenticator App.</mat-hint>
        </mat-form-field>
      </div>
    }
  </app-enrollment-customization-frame>
</app-dialog-wrapper>
