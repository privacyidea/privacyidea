<div
  class="token-type-config-container"
  #scrollContainer>
  <div
    class="sticky-header margin-bottom-8"
    [appStickyHeader]="scrollContainer">
    <div class="flex-row just-space-between ali-center">
      <h3
        class="margin-8"
        i18n="@@tokenTypeConfig.tokenTypeConfiguration"
        >Token Type Configuration</h3
      >
      @if (!configForm().valid()) {
        <p
          class="save-blocked-hint"
          role="status"
          i18n="@@tokenTypeConfig.saveBlockedByIncomplete"
          >Save is disabled: complete the panels marked Incomplete.</p
        >
      }
      <div class="flex-row ali-center gap-8">
        <button
          (click)="toggleAllPanels()"
          [attr.aria-label]="allPanelsOpen() ? 'Close all' : 'Open all'"
          [matTooltip]="allPanelsOpen() ? 'Close all' : 'Open all'"
          mat-icon-button
          type="button">
          <mat-icon>{{ allPanelsOpen() ? "unfold_less" : "unfold_more" }}</mat-icon>
        </button>
        <button
          (click)="save()"
          [disabled]="!authService.actionAllowed('configwrite') || !hasChanges() || !configForm().valid()"
          class="action-button-primary button-width-m"
          mat-stroked-button>
          <mat-icon>save</mat-icon>
          <span i18n="@@common.save">Save</span>
        </button>
      </div>
    </div>
  </div>
  <mat-accordion multi="true">
    <app-hotp-config
      [config]="configForm"
      [hashLibs]="hashLibs()"></app-hotp-config>
    <app-totp-config
      [config]="configForm"
      [hashLibs]="hashLibs()"
      [totpSteps]="totpSteps()"></app-totp-config>
    <app-u2f-config [config]="configForm"></app-u2f-config>
    <app-webauthn-config [config]="configForm"></app-webauthn-config>
    <app-radius-config
      [config]="configForm"
      [radiusServers]="systemService.radiusServers()"
      [radiusServersListable]="systemService.canListRadiusServers()"
      [expanded]="expandedPanel === 'radius'"></app-radius-config>
    <app-remote-config [config]="configForm"></app-remote-config>
    <app-sms-config
      [config]="configForm"
      [smsGateways]="smsGatewayNames()"
      [smsGatewaysListable]="smsGatewayService.canListSmsGateways()"
      [expanded]="expandedPanel === 'sms'"></app-sms-config>
    <app-tiqr-config [config]="configForm"></app-tiqr-config>
    <app-email-config
      [config]="configForm"
      [smtpServers]="smtpServerIdentifiers()"
      [smtpServersListable]="smtpService.canListSmtpServers()"
      [expanded]="expandEmail()"></app-email-config>
    <app-questionnaire-config
      (addQuestionRequest)="addQuestion()"
      (deleteRequest)="deleteQuestion($event)"
      [config]="configForm"
      [questionKeys]="questionKeys()"
      [expanded]="expandedPanel === 'questionnaire'"></app-questionnaire-config>
    <app-yubico-config
      [config]="configForm"
      [expanded]="expandedPanel === 'yubico'"></app-yubico-config>
    <app-yubikey-config
      (deleteRequest)="deleteSystemEntry($event)"
      (yubikeyCreateNewKey)="yubikeyAddNewKey($event)"
      [config]="configForm"
      [yubikeyApiIds]="yubikeyApiIds()"></app-yubikey-config>
    <app-daypassword-config
      [config]="configForm"
      [hashLibs]="hashLibs()"></app-daypassword-config>
  </mat-accordion>
</div>
