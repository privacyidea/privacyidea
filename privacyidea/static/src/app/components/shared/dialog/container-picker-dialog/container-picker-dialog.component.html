<app-dialog-wrapper
  [actions]="confirmActions()"
  [title]="title"
  (actionTriggered)="onAction($event)">
  @if (ownContainers().length > 0) {
    <div class="container-picker-buttons">
      @for (serial of ownContainers(); track serial) {
        <button
          type="button"
          [class.action-button-primary]="trimmedSerial() === serial"
          [class.action-button-secondary]="trimmedSerial() !== serial"
          (click)="setContainerSerial(serial)"
          mat-stroked-button>
          <mat-icon>folder</mat-icon>
          {{ serial }}
        </button>
      }
    </div>
  }
  <mat-form-field
    class="input-width-l"
    subscriptSizing="dynamic">
    <mat-label i18n="@@common.containerSerial">Container Serial</mat-label>
    <app-clearable-input
      (clearButtonClick)="setContainerSerial('')"
      [showClearButton]="containerSerial() !== ''">
      <input
        [value]="containerSerial()"
        (input)="setContainerSerial($any($event.target).value)"
        [matAutocomplete]="containerAuto"
        appAutofocus
        matInput />
    </app-clearable-input>
    <mat-autocomplete
      #containerAuto="matAutocomplete"
      (optionSelected)="setContainerSerial($event.option.value)">
      @for (option of suggestions(); track option) {
        <mat-option [value]="option">{{ option }}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
  @if (canAssignUser()) {
    <div class="container-picker-assign">
      <mat-checkbox
        [checked]="assignToUser()"
        (change)="assignToUser.set($event.checked)"
        i18n="@@container.assignContainerToUser">
        Assign Container to this user
      </mat-checkbox>
    </div>
  }
  @if (otherOwnerWarning()) {
    <div class="container-picker-warning inline-warning">{{ otherOwnerWarning() }}</div>
  }
</app-dialog-wrapper>
