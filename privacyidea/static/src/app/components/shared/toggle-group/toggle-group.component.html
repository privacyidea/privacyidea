<mat-button-toggle-group
  [attr.aria-label]="groupLabel()"
  [value]="value()"
  [disabled]="disabled()"
  [hideSingleSelectionIndicator]="hideSelectionIndicator()"
  (change)="value.set($event.value)">
  @for (v of values(); track v; let i = $index) {
    <mat-button-toggle
      [value]="v"
      [tabIndex]="tabIndexFor(v)"
      [appTruncationTooltip]="labelAt(i)"
      clipSelector=".mat-button-toggle-label-content"
      >{{ labelAt(i) }}</mat-button-toggle
    >
  }
</mat-button-toggle-group>
