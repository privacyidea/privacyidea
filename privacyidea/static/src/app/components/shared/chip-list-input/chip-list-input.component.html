<mat-form-field
  appearance="outline"
  subscriptSizing="dynamic"
  [class]="fieldClass()">
  <mat-label>{{ label() }}</mat-label>
  <mat-chip-grid
    #grid
    [attr.aria-label]="gridLabel()">
    @for (value of values(); track value) {
      <mat-chip-row
        [value]="value"
        [title]="chipLabel()(value)"
        (removed)="remove(value)">
        {{ chipLabel()(value) }}
        <button
          matChipRemove
          [attr.aria-label]="removeLabel(value)">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
    }
    <input
      [matChipInputFor]="grid"
      [formField]="draftField"
      [matChipInputSeparatorKeyCodes]="separatorKeyCodes"
      (matChipInputTokenEnd)="onTokenEnd($event)" />
  </mat-chip-grid>
</mat-form-field>

<div class="chip-list-extras">
  <ng-content select="[chipListExtras]" />
</div>
