<div class="edit-button-container">
  @let elementIsEditing =
    element().isEditing() ||
    (isEditingUser() && (element().keyMap.key === "username" || element().keyMap.key === "user_name")) ||
    (isEditingInfo() && element().keyMap.key === "info");
  @if (!shouldHideEdit()) {
    <button
      aria-label="Edit"
      i18n-aria-label="@@common.edit"
      mat-icon-button
      class="flex"
      (click)="toggleEdit()(element())">
      <mat-icon>edit</mat-icon>
    </button>
  } @else if (elementIsEditing) {
    <button
      aria-label="Save"
      i18n-aria-label="@@common.save"
      mat-icon-button
      color="primary"
      class="flex"
      (click)="saveEdit()(element())">
      <mat-icon>save</mat-icon>
    </button>
    <button
      aria-label="Cancel"
      i18n-aria-label="@@common.cancel"
      mat-icon-button
      class="red flex"
      (click)="cancelEdit()(element())">
      <mat-icon>cancel</mat-icon>
    </button>
  }
</div>
