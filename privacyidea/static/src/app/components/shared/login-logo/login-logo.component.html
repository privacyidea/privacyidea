@if (customLogo()) {
  <img
    alt=""
    class="custom-logo"
    height="307"
    ngSrc="{{ customLogo() }}"
    ngSrcset="1x"
    width="307" />
} @else {
  <img
    alt=""
    class="logo"
    height="307"
    ngSrc="assets/privacyIDEA1.png"
    ngSrcset="1x"
    sizes="(max-width: 307px) 100vw, 307px"
    width="307" />

  <img
    alt="privacyIDEA Authentication System"
    class="logo-text"
    height="109"
    ngSrc="assets/logo-text.png"
    ngSrcset="1x"
    sizes="(max-width: 575px) 100vw, 575px"
    width="575" />
}
